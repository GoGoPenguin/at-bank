name: Deploy to Firebase Functions

on:
  push:
    paths:
      - .github/workflows/firebase-functions.yml
      - "api/**"
    branches:
      - develop
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".tool-versions"

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json
        run: |
          cd api
          uv export --no-dev -o requirements.txt >/dev/null
          uv venv venv
          source venv/bin/activate
          uv sync --active
          echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_BASE64 }}" | base64 --decode > $GOOGLE_APPLICATION_CREDENTIALS
          # firebase functions:artifacts:setpolicy --location asia-east1
          cp .env.template .env
          sed -i "s/^GOOGLE_APPLICATION_CREDENTIALS=.*/GOOGLE_APPLICATION_CREDENTIALS=$GOOGLE_APPLICATION_CREDENTIALS/" .env
          firebase deploy --only functions --project at-bank-490b5 --non-interactive --force
          rm $GOOGLE_APPLICATION_CREDENTIALS
          deactivate
