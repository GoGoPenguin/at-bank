name: Deploy to Firebase Hosting
on:
  pull_request:
  push:
    paths:
      - .github/workflows/firebase-hosting.yml
      - "web/**"
    branches:
      - develop
      - main

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Web App
        env:
          VITE_BASE_URL: ${{ vars.BASE_URL }}
        run: |
          cd web
          npm ci
          mv .env.template .env
          sed -i "s|^VITE_BASE_URL=.*|VITE_BASE_URL=$VITE_BASE_URL|" .env
          npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_AT_BANK_490B5 }}"
          channelId: ${{ github.ref_name == 'main' && 'live' || format('{0}-{1}', github.head_ref || github.ref_name, github.run_number) }}
          projectId: at-bank-490b5
          target: at-bank-490b5
